# Index definitions for the homelab SIEM. See docs/architecture/siem.md.
# Retention is time-based (frozenTimePeriodInSecs) with a size cap so no
# single index can fill the 150 GiB data disk. Frozen data is deleted.

[netfw]
homePath   = $SPLUNK_DB/netfw/db
coldPath   = $SPLUNK_DB/netfw/colddb
thawedPath = $SPLUNK_DB/netfw/thaweddb
# 90 days
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 20000

[dns]
homePath   = $SPLUNK_DB/dns/db
coldPath   = $SPLUNK_DB/dns/colddb
thawedPath = $SPLUNK_DB/dns/thaweddb
# 30 days
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 20000

