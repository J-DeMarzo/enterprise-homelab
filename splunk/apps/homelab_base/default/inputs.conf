# Inputs on the indexer (splunk, 10.12.30.20). See docs/architecture/siem.md.

# Universal Forwarders (Mgmt, Servers, Security, DMZ). Gateway ACL rules 2/8 + ufw.
[splunktcp://9997]
disabled = 0

# Remote syslog written to disk by rsyslog (splunk/server/rsyslog-remote.conf).
# One folder per sending host IP. host = that IP (4th path segment).
# Omada gateway/controller events -> netfw. Sourcetype is finalized once real samples are seen.
[monitor:///var/log/remote]
disabled = 0
index = netfw
sourcetype = omada:syslog
host_segment = 4
whitelist = \.log$
