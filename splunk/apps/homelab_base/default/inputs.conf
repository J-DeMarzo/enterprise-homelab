# Inputs on the indexer (splunk, 10.12.30.20). See docs/architecture/siem.md.

# Universal Forwarders (Mgmt, Servers, Security, DMZ). Gateway ACL rules 2/8 + ufw.
[splunktcp://9997]
disabled = 0

# Remote syslog written to disk by rsyslog (splunk/server/rsyslog-remote.conf):
# /var/log/remote/<sender-ip>/<date>.log. host = sender IP (4th path segment).
#
# Sourcetypes are set HERE, per sender folder. An explicit inputs.conf sourcetype
# outranks props.conf [source::] renames, so a single catch-all monitor with a
# default sourcetype silently disables per-sender parsing (and the household
# privacy filter attached to omada:eap). Learned the hard way on 2026-09-30.

[monitor:///var/log/remote/10.12.30.1]
disabled = 0
index = netfw
sourcetype = omada:gateway
host_segment = 4
whitelist = \.log$

[monitor:///var/log/remote/10.12.5.2]
disabled = 0
index = netfw
sourcetype = omada:controller
host_segment = 4
whitelist = \.log$

[monitor:///var/log/remote/10.12.5.200]
disabled = 0
index = netfw
sourcetype = omada:eap
host_segment = 4
whitelist = \.log$

# Any other sender (e.g. a new access point) lands here unparsed, so it's visible
# but not silently mixed into the parsed sourcetypes. The known senders are excluded.
[monitor:///var/log/remote]
disabled = 0
index = netfw
sourcetype = syslog:unclassified
host_segment = 4
whitelist = \.log$
blacklist = ^/var/log/remote/(10\.12\.30\.1|10\.12\.5\.2|10\.12\.5\.200)/
