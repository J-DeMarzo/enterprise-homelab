# Zone enrichment: maps any IPv4 address to its VLAN zone and trust level.
# Usage:  | lookup vlan_zones cidr AS src_ip OUTPUT zone AS src_zone trust AS src_trust
# Automatic lookups per sourcetype are added in props.conf as sources are onboarded.
[vlan_zones]
filename = vlan_zones.csv
match_type = CIDR(cidr)
max_matches = 1
min_matches = 1
default_match = external

# Household privacy (ADR 0007): Wi-Fi flow records from/to Internal (10.12.10.0/24)
# or Guest (10.12.99.0/24) are discarded before indexing.
[drop_household_eap]
REGEX = IP (?:SRC|DST)=10\.12\.(?:10|99)\.\d+\b
DEST_KEY = queue
FORMAT = nullQueue

# Household privacy (ADR 0007), DNS. Applied in order (TRANSFORMS-privacy in props.conf):
#  1. drop every query whose CLIENT is Internal (10.12.10.0/24) or Guest (10.12.99.0/24)
#  2. put back the security signals from those clients: failed lookups
#     (NxDomain, ServerFailure, Refused) and blocked answers (0.0.0.0 / ::)
#  3. drop again the failures that are only search-domain artifacts
#     ("<site>.demarzo.lab" NxDomain), since they'd reveal the site being browsed
# Real format: [2026-09-30 17:06:45 UTC] [10.12.20.125:54183] [UDP] QNAME: x; QTYPE: A; QCLASS: IN; RCODE: NoError; ANSWER: [..]
[drop_household_dns]
REGEX = ^\[[^\]]+\] \[10\.12\.(?:10|99)\.\d{1,3}:\d+\]
DEST_KEY = queue
FORMAT = nullQueue

[keep_household_dns_signals]
REGEX = ^\[[^\]]+\] \[10\.12\.(?:10|99)\.\d{1,3}:\d+\].*(?:RCODE: (?:NxDomain|ServerFailure|Refused);|ANSWER: \[(?:0\.0\.0\.0|::)\])
DEST_KEY = queue
FORMAT = indexQueue

[drop_household_dns_searchsuffix]
REGEX = ^\[[^\]]+\] \[10\.12\.(?:10|99)\.\d{1,3}:\d+\] \[\w+\] QNAME: [^;]+\.demarzo\.lab; .*RCODE: NxDomain;
DEST_KEY = queue
FORMAT = nullQueue

# Gateway ACL rule IDs -> rule names. The gateway logs Omada's internal rule ID
# (DESC=), not the rule number. IDs are added as they're observed (siem.md).
[omada_acl_rules]
filename = omada_acl_rules.csv

# Baselines for the detections, written daily by the "Baseline - ..." searches
# (detections/baselines/). They live only on the server: deploy-app.sh never
# overwrites them, and they're not in the repo (the IoT list describes household
# devices' traffic).
[known_mgmt_devices]
filename = known_mgmt_devices.csv

[iot_known_domains]
filename = iot_known_domains.csv

# Windows XML events: each <Data Name='x'>v</Data> pair in EventData becomes field x = v
# (props.conf [source::WinEventLog:*]). Repeated names stay multivalued.
[xmlwin_eventdata]
REGEX = <Data Name='([^']+)'>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = true
