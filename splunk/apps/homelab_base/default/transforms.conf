# Zone enrichment: maps any IPv4 address to its VLAN zone and trust level.
# Usage:  | lookup vlan_zones cidr AS src_ip OUTPUT zone AS src_zone trust AS src_trust
# Automatic lookups per sourcetype are added in props.conf as sources are onboarded.
[vlan_zones]
filename = vlan_zones.csv
match_type = CIDR(cidr)
max_matches = 1
min_matches = 1
default_match = external

# Household privacy (ADR 0007): Wi-Fi flow records from/to Internal (10.12.10.0/24)
# or Guest (10.12.99.0/24) are discarded before indexing.
[drop_household_eap]
REGEX = IP (?:SRC|DST)=10\.12\.(?:10|99)\.\d+\b
DEST_KEY = queue
FORMAT = nullQueue

# Household privacy (ADR 0007), DNS. CONSERVATIVE first version: any Technitium
# line containing an Internal or Guest address is discarded, before the log format
# is confirmed with real samples. After onboarding, this is narrowed to keep
# failed/blocked lookups (NXDOMAIN, SERVFAIL, REFUSED, blocked) from those clients.
[drop_household_dns]
REGEX = \b10\.12\.(?:10|99)\.\d{1,3}\b
DEST_KEY = queue
FORMAT = nullQueue
