# Sourcetypes, parsing, and automatic zone lookups. See docs/architecture/siem.md.
# Written against real samples from each source (2026-09-30).

# --- Omada syslog ------------------------------------------------------------
# rsyslog writes /var/log/remote/<sender-ip>/<date>.log with a receive-time
# prefix (splunk/server/rsyslog-remote.conf). Omada device clocks drifted ~3 min,
# so the event time is rsyslog's NTP-synced receive time. The device's own
# timestamp stays in the raw event. Sourcetypes are assigned per sender folder in
# inputs.conf (not here: an explicit inputs.conf sourcetype outranks [source::]).

# --- ER605 gateway: ACL events -------------------------------------------------
# ...firewall<5>: [ACL]GATEWAY=..,DESC=<rule id>,ACTION=Block,SRC_MAC=..,DST_MAC=..,SRC=..,DST=..,PROTO=TCP,Sport=..,Dport=..
[omada:gateway]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 35
EXTRACT-acl = DESC=(?<acl_id>\d+),ACTION=(?<action>\w+),SRC_MAC=(?<src_mac>[^,]+),DST_MAC=(?<dest_mac>[^,]+),SRC=(?<src_ip>[\d.]+),DST=(?<dest_ip>[\d.]+),PROTO=(?<transport>\w+)(?:,Sport=(?<src_port>\d+),Dport=(?<dest_port>\d+))?
LOOKUP-src_zone  = vlan_zones cidr AS src_ip  OUTPUT zone AS src_zone  trust AS src_trust
LOOKUP-dest_zone = vlan_zones cidr AS dest_ip OUTPUT zone AS dest_zone trust AS dest_trust

# --- Omada controller: DHCP and client events ---------------------------------
# ... DHCP Server allocated IP address 10.12.5.100 for the [client:F0-A7-31-0C-5F-90 ].
[omada:controller]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 35
EXTRACT-dhcp = DHCP Server allocated IP address (?<src_ip>[\d.]+) for the \[client:(?<src_mac>[0-9A-Fa-f-]+)
LOOKUP-src_zone = vlan_zones cidr AS src_ip OUTPUT zone AS src_zone trust AS src_trust

# --- Omada access point: Wi-Fi client flow records ------------------------------
# One syslog message carries several records joined by CRLF, which rsyslog
# escapes as #015#012. Split them. Records after the first have no receive-time
# prefix and inherit the previous event's time (same batch).
# [epoch] AP MAC=.. MAC SRC=.. IP SRC=.. IP DST=.. IP proto=6 SPT=.. DPT=..
[omada:eap]
SHOULD_LINEMERGE = false
LINE_BREAKER = (#015#012|[\r\n]+)
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 35
# Household privacy (ADR 0007): drop records to/from Internal and Guest at index time.
TRANSFORMS-privacy = drop_household_eap
EXTRACT-flow = AP MAC=(?<ap_mac>\S+) MAC SRC=(?<src_mac>\S+) IP SRC=(?<src_ip>[\d.]+) IP DST=(?<dest_ip>[\d.]+) IP proto=(?<protocol_number>\d+)(?: SPT=(?<src_port>\d+) DPT=(?<dest_port>\d+))?
LOOKUP-src_zone  = vlan_zones cidr AS src_ip  OUTPUT zone AS src_zone  trust AS src_trust
LOOKUP-dest_zone = vlan_zones cidr AS dest_ip OUTPUT zone AS dest_zone trust AS dest_trust

# --- Technitium DNS query logs (via Universal Forwarder on dns1/dns2) ----------
# Parsing is finalized against real samples. The privacy filter is in place
# BEFORE the first event arrives.
[technitium:query]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRANSFORMS-privacy = drop_household_dns
