# /etc/rsyslog.d/10-remote.conf on splunk (10.12.30.20)
# Receives syslog on 514/udp+tcp and writes one file per sender per day, which
# Splunk monitors (inputs.conf [monitor:///var/log/remote]). rsyslog owns the
# privileged port, so Splunk runs unprivileged and nothing is lost during Splunk restarts.
# Access to 514 is restricted by ufw (see docs/runbooks/deploy-splunk.md).

module(load="imudp")
module(load="imtcp")

template(name="RemotePerHost" type="string"
         string="/var/log/remote/%FROMHOST-IP%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Line format: <receive time, NTP-synced> <sender IP> <original message incl. device header>
# Splunk takes the event time from the first field, because device clocks drift
# (the Omada devices were ~3 min slow).
template(name="RemoteLine" type="string"
         string="%TIMEGENERATED:::date-rfc3339% %FROMHOST-IP% %rawmsg-after-pri%\n")

# Ubuntu's rsyslog runs as user "syslog" (it drops root), so it can't chown files.
# Instead /var/log/remote is created syslog:splunk with mode 2750 (setgid), and
# new per-host folders inherit setgid + the "splunk" group from it (kernel behavior),
# and files inherit the group. Splunk reads them as group.
ruleset(name="remote") {
    action(type="omfile" dynaFile="RemotePerHost" template="RemoteLine"
           dirCreateMode="0750" fileCreateMode="0640")
    stop
}

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")
