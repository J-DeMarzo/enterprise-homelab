services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    restart: unless-stopped
    ports: ["80:80"]
    environment:
      DB_SERVER: db
    depends_on: [db]
    volumes: ["/var/log/dvwa:/var/log/apache2"]
  db:
    image: mariadb:10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes: ["dvwa-db:/var/lib/mysql"]
volumes:
  dvwa-db:
